<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Shelf — Board Game Collection</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--paper:#efe6d8;--card:#fffbf4;--ink:#241a12;--soft:#6b625a;--rule:#d9cdbd;--green:#1e4638;--brass:#b98a44;--brick:#8a3c2e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Work Sans,sans-serif}.wrap{max-width:1220px;margin:auto;padding:56px 24px 80px}header{border-bottom:1px solid var(--rule);padding-bottom:28px}h1,h2{font-family:Fraunces,serif;font-weight:300;text-transform:uppercase;letter-spacing:.03em}h1{font-size:clamp(2rem,6vw,3.6rem);margin:0 0 10px;line-height:1}.sub{color:var(--soft);max-width:66ch;line-height:1.55}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 8px}input,button{font:inherit;border:1px solid var(--rule);border-radius:7px;padding:10px 14px;background:var(--card);color:var(--ink)}input{min-width:220px;flex:1}.chip{cursor:pointer}.chip.active{background:var(--brass);border-color:var(--brass)}.count{color:var(--soft);font-size:13px;margin:14px 0 24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}.game{background:var(--card);border:1px solid var(--rule);border-radius:5px;overflow:hidden;box-shadow:0 1px 2px #241a120d}.banner{height:82px;background:linear-gradient(135deg,var(--c),#20140c);display:flex;align-items:center;padding:18px;color:#fffbf4;font:600 28px Fraunces,serif;letter-spacing:.08em}.content{padding:18px}.game h2{font-size:22px;margin:0 0 8px;line-height:1.1}.tagline{color:var(--soft);font-size:14px;min-height:42px;line-height:1.45}.meta{border-top:1px solid var(--rule);padding-top:12px;color:var(--soft);font-size:12px;line-height:1.7}.type{display:inline-block;background:var(--c);color:#fff;padding:5px 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-radius:3px}footer{margin-top:44px;border-top:1px solid var(--rule);padding-top:22px;color:var(--soft);font-size:13px}@media(max-width:620px){.wrap{padding:36px 14px 60px}}</style></head><body><main class="wrap"><header><h1>Board Game Collection</h1><p class="sub">Everything on the shelf — from quick card games to weekend strategy games.</p></header><div class="toolbar"><input id="search" placeholder="Search a game…"><button class="chip active" data-filter="all">All</button><button class="chip" data-filter="Strategy">Strategy</button><button class="chip" data-filter="Family">Family</button><button class="chip" data-filter="Card Game">Card Game</button><button class="chip" data-filter="Party">Party</button><button class="chip" data-filter="Deduction/Horror">Horror & Mystery</button></div><p class="count" id="count"></p><section class="grid" id="grid"></section><footer>Catalogued from the shelf, the top of the cabinet, and a few loose stacks — <span id="total"></span> games in all.</footer></main><script>const games=[['The Quacks of Quedlinburg','Family','Push your luck pulling ingredients from the bag before your pot boils over.','2–4','45 min'],['Carcassonne','Family','Build a medieval landscape one tile at a time, then stake your claim on it.','2–5','35 min'],['Kingdomino','Family','Draft dominoes into the best five by five kingdom.','2–4','20 min'],['Catan Card Game','Strategy','The two player duel version of Catan, played entirely in cards.','2','45 min'],['Delivery Witches','Family','', '1–4','60 min'],['Legend of the Five Rings: The Card Game','Card Game','Seven clans of Rokugan fight for honour, land and the Emperor’s favour.','2',''],['Starfluxx','Card Game','The rules and the goal keep changing, somewhere out in deep space.','2–6','10–40 min'],['Gloom','Card Game','Make your own family miserable, then kill them off while they are at their lowest.','2–4','60 min'],['Happy Little Dinosaurs','Card Game','Dodge meteors, drama and natural disasters with a cheerful cartoon dinosaur.','2–4','30–60 min'],['Critter Kitchen','Family','Run a restaurant kitchen staffed entirely by animals.','1–4','60 min'],['Wingspan Pocket','Strategy','The full Wingspan engine, shrunk down to fit in a coat pocket.','1–5','25–35 min'],['Flip 7','Card Game','Flip cards until you either hit seven different numbers or bust.','3+','20 min'],['Tokaido','Family','Travel the old road from Kyoto to Edo, and take your time doing it.','2–5','45 min'],['Ticket to Ride: Europe','Strategy','Claim rail routes across Europe with tunnels, ferries and stations in the way.','2–5','45–60 min'],['Flamecraft','Strategy','Place artisan dragons in shops and enchant the town as you go.','1–5','60 min'],['Takenoko','Family','Grow a bamboo garden while a hungry panda eats his way through it.','2–4','45 min'],['Azul','Strategy','Draft ceramic tiles for the palace wall and leave your opponents the scraps.','2–4','30–45 min'],['Elder Sign','Deduction/Horror','Roll your way through a haunted museum before the ancient one wakes.','1–8','60–90 min'],['Trails','Family','A short hike through a national park, collecting birds, views and badges.','2–4','20–40 min'],['Love Letter','Card Game','Sixteen cards, one in hand, and a court full of people worth suspecting.','2–4','20 min'],['Doctor Who Fluxx','Card Game','The rules keep changing, and so does the Doctor.','2–6','5–30 min']];const c={Strategy:'#1e4638',Family:'#b98a44','Card Game':'#8a3c2e',Party:'#6b4a8a','Deduction/Horror':'#3a3a3a'},grid=document.querySelector('#grid'),search=document.querySelector('#search'),count=document.querySelector('#count');let filter='all';function render(){const q=search.value.toLowerCase(),list=games.filter(g=>(filter==='all'||g[1]===filter)&&g[0].toLowerCase().includes(q));count.textContent=`Showing ${list.length} of ${games.length} games`;grid.innerHTML=list.map(g=>`<article class="game" style="--c:${c[g[1]]}"><div class="banner">${g[0].split(' ').filter(x=>!['The','of','the'].includes(x)).slice(0,2).map(x=>x[0]).join('')}</div><div class="content"><span class="type">${g[1]}</span><h2>${g[0]}</h2><p class="tagline">${g[2]}</p><div class="meta">Players: ${g[3]||'—'}<br>Duration: ${g[4]||'—'}</div></div></article>`).join('')}document.querySelector('#total').textContent=games.length;search.oninput=render;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});render()</script></body></html>
